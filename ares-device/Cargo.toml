[package]
name = "ares-device"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Show information about the webOS devices you set up"

[lints]
workspace = true

[dependencies]
ares-device-lib = { workspace = true }
ares-connection-lib = { workspace = true }
clap = { workspace = true }
cfg-if = "1.0.4"

# libssh build options live in common/connection, which every device-facing
# tool depends on.
[target.'cfg(target_os="windows")'.dependencies]
native-windows-gui = { version = "1.0.13" }
native-windows-derive = "1.0.5"

# The device picker uses GTK everywhere except Windows and macOS.
[target.'cfg(all(not(target_os="windows"), not(target_os="macos")))'.dependencies]
gtk = "0.18.2"

[build-dependencies]
embed-manifest = "1.5.0"

[package.metadata.deb]
section = "devel"
